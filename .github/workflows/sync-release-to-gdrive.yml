name: Sync Latest Release to Google Drive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to transfer (latest only)"
        required: true
        type: string
      asset_pattern:
        description: "Asset filename pattern to upload"
        required: false
        default: "*.zip"
        type: string
      upload_uri:
        description: "One-time Google Drive resumable upload session URI (private repo only; auto-expires on finalize)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  upload-latest-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_PATTERN: ${{ inputs.asset_pattern }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel_dl
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -p "$ASSET_PATTERN" -D /tmp/rel_dl
          ls -lh /tmp/rel_dl

      - name: Stream latest release ZIP to Google Drive resumable session
        env:
          GDRIVE_UPLOAD_URI: ${{ inputs.upload_uri || secrets.GDRIVE_UPLOAD_URI }}
        run: |
          if [ -n "$GDRIVE_UPLOAD_URI" ]; then
            echo "::add-mask::$GDRIVE_UPLOAD_URI"
          fi
          python3 - <<'PYEOF'
          import glob, os, sys, urllib.request, urllib.error

          uri = os.environ.get("GDRIVE_UPLOAD_URI", "").strip()
          if not uri:
              raise SystemExit("GDRIVE_UPLOAD_URI secret is empty")

          files = sorted(glob.glob("/tmp/rel_dl/*.zip"))
          if not files:
              raise SystemExit("No .zip asset downloaded")
          fpath = files[0]
          total_size = os.path.getsize(fpath)
          chunk_size = 8 * 1024 * 1024  # 8 MiB (multiple of 256 KiB)
          print(f"[GDRIVE] Uploading {os.path.basename(fpath)} ({total_size} bytes) in 8 MiB chunks...")

          offset = 0
          with open(fpath, "rb") as f:
              while offset < total_size:
                  data = f.read(chunk_size)
                  if not data:
                      break
                  is_final = (offset + len(data)) >= total_size
                  cmd = "upload, finalize" if is_final else "upload"
                  headers = {
                      "Content-Length": str(len(data)),
                      "Content-Type": "application/zip",
                      "X-Goog-Upload-Offset": str(offset),
                      "X-Goog-Upload-Command": cmd,
                  }
                  req = urllib.request.Request(uri, data=data, headers=headers, method="PUT")
                  try:
                      with urllib.request.urlopen(req, timeout=180) as resp:
                          status = resp.headers.get("X-Goog-Upload-Status", "").lower()
                          body = resp.read().decode("utf-8", errors="ignore")
                  except urllib.error.HTTPError as e:
                      status = e.headers.get("X-Goog-Upload-Status", "").lower() if e.headers else ""
                      body = e.read().decode("utf-8", errors="ignore")
                      if status not in ("active", "final"):
                          print(f"[ERROR] HTTP {e.code} status={status!r} body={body[:400]}", file=sys.stderr)
                          raise SystemExit(1)

                  offset += len(data)
                  pct = (offset / total_size) * 100.0
                  print(f"[GDRIVE] {offset}/{total_size} ({pct:.1f}%) status={status}")
                  if is_final:
                      if status != "final":
                          raise SystemExit(f"Expected final status, got {status!r}: {body[:400]}")
                      print("[GDRIVE] Upload finalized successfully!")
                      print(body[:500])
          PYEOF
