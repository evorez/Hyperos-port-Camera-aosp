name: Verify Gold-Stock release ZIP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. build-20261125-122038)"
        required: true
      expect_fix:
        description: "smali symbol that must be present in the patched DEX (60fps fix)"
        required: false
        default: "get60FpsOperatingMode"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zip' -p '*.sha256' -D /tmp/rel
          ls -lh /tmp/rel

      - name: Check uploaded SHA-256 matches file
        run: |
          set -euo pipefail
          cd /tmp/rel
          sha256sum -c ./*.zip.sha256
          echo "::notice::SHA-256 verified against published checksum"

      - name: Validate flashable module structure
        run: |
          set -euo pipefail
          ZIP="$(ls /tmp/rel/*.zip | head -n 1)"
          python3 tools/validate_module.py "$ZIP"

      - name: Inspect bundled APK, libs, permissions and patch payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECT_FIX: ${{ inputs.expect_fix }}
        run: |
          set -euo pipefail
          ZIP="$(ls /tmp/rel/*.zip | head -n 1)"
          python3 - "$ZIP" <<'PY'
          import os, sys, zipfile, tempfile, pathlib, subprocess, hashlib
          sys.path.insert(0, "tools")
          from axml_inspector import inspect_apk

          zip_path = pathlib.Path(sys.argv[1])
          expect = os.environ.get("EXPECT_FIX", "").strip()
          lines = ["### Gold-Stock release verification", "", f"ZIP: `{zip_path.name}` ({zip_path.stat().st_size:,} bytes)"]
          with zipfile.ZipFile(zip_path) as zf:
              names = zf.namelist()
              lines.append(f"- entries: **{len(names)}**")
              prop = zf.read("module.prop").decode("utf-8", "ignore")
              for line in prop.splitlines():
                  if line.startswith(("id=", "name=", "version=", "versionCode=")):
                      lines.append(f"- module.prop `{line}`")
              apks = [n for n in names if n.endswith(".apk")]
              libs = [n for n in names if n.endswith(".so")]
              perms = [n for n in names if n.startswith("system/etc/permissions/") or n.startswith("system/etc/sysconfig/")]
              lines += [
                  f"- bundled APKs: {', '.join(apks) if apks else 'NONE'}",
                  f"- extracted native libs: **{len(libs)}**",
                  f"- permission/sysconfig XMLs: **{len(perms)}**",
              ]
              with tempfile.TemporaryDirectory() as tmp:
                  apk_name = apks[0] if apks else None
                  if apk_name:
                      apk_path = pathlib.Path(tmp) / "cam.apk"
                      apk_path.write_bytes(zf.read(apk_name))
                      info = inspect_apk(apk_path)
                      lines += [
                          f"- APK package: `{info.package}`",
                          f"- APK versionName: `{info.version_name}` (code `{info.version_code}`)",
                          f"- APK minSdk/targetSdk: `{info.min_sdk}` / `{info.target_sdk}`",
                      ]
                      # Verify the smali patch really landed inside the shipped DEX
                      if expect:
                          found = []
                          with zipfile.ZipFile(apk_path) as azf:
                              for dex in [n for n in azf.namelist() if n.endswith(".dex")]:
                                  blob = azf.read(dex)
                                  if expect.encode() in blob:
                                      found.append(dex)
                          if found:
                              lines.append(f"- patch symbol `{expect}` present in: {', '.join(found)} ✅")
                          else:
                              lines.append(f"- patch symbol `{expect}` **MISSING** ❌")
                              print("::error::expected patch symbol not found in shipped DEX")
              # privapp/perm sanity for the camera package
              for p in perms[:6]:
                  lines.append(f"- `{p}`")
          print("\n".join(lines))
          pathlib.Path("/tmp/verify.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat /tmp/verify.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verification summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Gold-Stock verification (\`${{ inputs.tag }}\`)"
            echo
            cat /tmp/verify.md
          } > /tmp/verify_body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/verify_body.md >/dev/null 2>&1 || echo "comment not posted"
