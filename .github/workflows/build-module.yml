name: Validate & Build HyperOS Camera AOSP Module

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      gdrive_file_id:
        description: "Google Drive File ID of a source ZIP (e.g. Leica/HyperOS camera pack) or APK"
        required: false
        default: ""
      source_zip_url:
        description: "Direct download URL of an existing HyperOS/Leica camera ZIP to repackage"
        required: false
        default: ""
      apk_url:
        description: "Direct download URL for modded MiuiCamera.apk"
        required: false
        default: ""
      extraphoto_url:
        description: "Optional direct download URL for MiuiExtraPhoto.apk"
        required: false
        default: ""
      inspect_only:
        description: "Decompile MiuiCamera.apk (--no-res) and publish a feature/smali inspection report instead of building"
        type: boolean
        required: false
        default: false
      apply_patches:
        description: "Apply APK smali/asset patches from patch_spec and rebuild+sign MiuiCamera.apk"
        type: boolean
        required: false
        default: false
      patch_spec:
        description: "Path to JSON patch spec in repo (used when apply_patches=true)"
        required: false
        default: "patches/unlock_features.json"
      publish_release:
        description: "Publish the built flashable ZIP to GitHub Releases for direct 1-tap phone download"
        type: boolean
        required: false
        default: true
      sync_release_tag:
        description: "Optional: stream an existing release tag ZIP directly to Google Drive (skips build)"
        required: false
        default: ""
      output_name:
        description: "Output ZIP filename inside dist/ (default: Gold-Stock.zip)"
        required: false
        default: "Gold-Stock.zip"
      gdrive_upload_uri:
        description: "Optional: one-time Google Drive resumable upload session URI"
        required: false
        default: ""

jobs:
  sync-release-to-gdrive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_release_tag != '' && inputs.gdrive_upload_uri != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download & stream latest release ZIP to Google Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.sync_release_tag }}
          GDRIVE_UPLOAD_URI: ${{ inputs.gdrive_upload_uri }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GDRIVE_UPLOAD_URI"
          mkdir -p /tmp/rel_dl
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -p "*.zip" -D /tmp/rel_dl
          python3 - <<'PY'
          import glob, os, urllib.request
          uri = os.environ["GDRIVE_UPLOAD_URI"].strip()
          files = glob.glob("/tmp/rel_dl/*.zip")
          assert files, "No release ZIP downloaded"
          path = files[0]
          total = os.path.getsize(path)
          chunk_size = 8 * 1024 * 1024
          print(f"Streaming {os.path.basename(path)} ({total} bytes) to Google Drive...")
          offset = 0
          with open(path, "rb") as f:
              while offset < total:
                  data = f.read(chunk_size)
                  n = len(data)
                  is_last = (offset + n) >= total
                  cmd = "upload, finalize" if is_last else "upload"
                  req = urllib.request.Request(uri, data=data, method="PUT")
                  req.add_header("Content-Length", str(n))
                  req.add_header("X-Goog-Upload-Offset", str(offset))
                  req.add_header("X-Goog-Upload-Command", cmd)
                  req.add_header("X-Goog-Upload-Total-Size", str(total))
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      status = resp.headers.get("X-Goog-Upload-Status", "")
                      body = resp.read().decode("utf-8", errors="ignore")
                  offset += n
                  pct = (offset / total) * 100
                  print(f"Uploaded {offset}/{total} ({pct:.1f}%) status={status}")
                  if is_last:
                      print("FINALIZED:", body[:300])
                      assert status == "final", f"Expected final, got {status}"
          PY

  test-and-validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_release_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run automated test suite
        run: python3 -m unittest discover -s tests -v

      - name: Dry-run template build & validation
        run: ./build.sh --allow-no-apk --output dist/template-dryrun.zip

  build-flashable-zip:
    if: github.event_name == 'workflow_dispatch'
    needs: test-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install apktool + Android SDK tools (when inspecting or patching APK)
        if: ${{ inputs.inspect_only == true || inputs.apply_patches == true }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fSL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o "$HOME/.local/bin/apktool"
          curl -fSL "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" -o "$HOME/.local/bin/apktool.jar"
          chmod +x "$HOME/.local/bin/apktool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/apktool" --version

          # Android SDK: patch_apk.py needs android.jar (javac/d8 classpath) plus d8/zipalign/apksigner/aapt2
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          HAVE_PLATFORM="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar 2>/dev/null | tail -n 1 || true)"
          if [ -z "$HAVE_PLATFORM" ]; then
            echo "[SDK] no android.jar found - installing platform + build-tools"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$BT" ]; then
            echo "${BT%/}" >> "$GITHUB_PATH"
          fi
          echo "[SDK] java=$(java -version 2>&1 | head -n 1)"
          echo "[SDK] android.jar=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar 2>/dev/null | tail -n 1 || echo MISSING)"
          echo "[SDK] d8=$(ls -d "$ANDROID_HOME"/build-tools/*/d8 2>/dev/null | tail -n 1 || echo MISSING)"
          echo "[SDK] zipalign=$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | tail -n 1 || echo MISSING)"
          echo "[SDK] apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -n 1 || echo MISSING)"

      - name: Download & import source payload
        env:
          GDRIVE_ID: ${{ inputs.gdrive_file_id }}
          SOURCE_ZIP_URL: ${{ inputs.source_zip_url }}
          APK_URL: ${{ inputs.apk_url }}
          EXTRA_URL: ${{ inputs.extraphoto_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cam_dl
          PAYLOAD="/tmp/cam_dl/downloaded_payload"

          if [ -n "$GDRIVE_ID" ]; then
            echo "[DL] Downloading Google Drive file ID: $GDRIVE_ID"
            python3 tools/gdrive_download.py --id "$GDRIVE_ID" --out "$PAYLOAD"
          elif [ -n "$APK_URL" ]; then
            echo "[DL] Downloading APK from direct URL"
            python3 tools/gdrive_download.py --url "$APK_URL" --out "$PAYLOAD"
          elif [ -n "$SOURCE_ZIP_URL" ]; then
            echo "[DL] Downloading source ZIP from direct URL"
            python3 tools/gdrive_download.py --url "$SOURCE_ZIP_URL" --out "$PAYLOAD"
            python3 tools/import_source_zip.py "$PAYLOAD"
            PAYLOAD=""
          else
            echo "::error::No payload source provided. Pass gdrive_file_id, apk_url or source_zip_url."
            exit 1
          fi

          if [ -n "$PAYLOAD" ]; then
            ls -lh "$PAYLOAD"
            if python3 -c "import zipfile, sys; z = zipfile.ZipFile(sys.argv[1]); sys.exit(0 if 'AndroidManifest.xml' in z.namelist() else 1)" "$PAYLOAD"; then
              echo "[DL] Detected direct APK payload"
              cp "$PAYLOAD" input/apk/MiuiCamera.apk
              python3 tools/axml_inspector.py input/apk/MiuiCamera.apk | head -n 40 || true
            else
              echo "[DL] Detected source module ZIP payload; importing..."
              python3 tools/import_source_zip.py "$PAYLOAD"
            fi
          fi

          if [ -n "$EXTRA_URL" ]; then
            python3 tools/gdrive_download.py --url "$EXTRA_URL" --out input/apk/MiuiExtraPhoto.apk
          fi

          ls -lh input/apk/ || true

      - name: Inspect MiuiCamera.apk (inspect_only mode)
        if: ${{ inputs.inspect_only == true }}
        run: |
          set -euo pipefail
          python3 tools/patch_apk.py input/apk/MiuiCamera.apk \
            --inspect-json /tmp/apk_inspect.json \
            --inspect-md /tmp/apk_inspect.md
          cat /tmp/apk_inspect.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inspection report artifact
        if: ${{ inputs.inspect_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-inspect-report
          path: |
            /tmp/apk_inspect.md
            /tmp/apk_inspect.json

      - name: Patch, rebuild & re-sign MiuiCamera.apk
        if: ${{ inputs.inspect_only != true && inputs.apply_patches == true }}
        env:
          PATCH_SPEC: ${{ inputs.patch_spec }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          : > /tmp/patch.log
          diag() {
            rc=$?
            [ "$rc" -eq 0 ] && return 0
            echo "::error::patch step failed at line ${LINENO} (rc=$rc)"
            {
              echo "### patch step failure (line ${LINENO}, rc=$rc)"
              echo '```'
              sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/patch.log 2>/dev/null | tail -n 200
              echo '```'
            } > /tmp/fail_body.md || true
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@/tmp/fail_body.md >/dev/null 2>&1 || echo "[PATCH] diagnostics comment not posted"
            return "$rc"
          }
          trap diag ERR

          python3 tools/patch_apk.py input/apk/MiuiCamera.apk \
            --patch-spec "$PATCH_SPEC" \
            --out-apk /tmp/MiuiCamera_patched.apk \
            --patch-report /tmp/patch_report.md 2>&1 | tee /tmp/patch.log

          test -f /tmp/MiuiCamera_patched.apk
          mv -f /tmp/MiuiCamera_patched.apk input/apk/MiuiCamera.apk
          AAPT2="$(ls -1 /usr/local/lib/android/sdk/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$AAPT2" ]; then
            echo "[VERIFY] Checking patched AndroidManifest.xml with aapt2..."
            ("$AAPT2" dump badging input/apk/MiuiCamera.apk 2>&1 || true) | grep -E "^package:" | tee /tmp/aapt2_pkg.txt || true
          fi
          python3 -c '
          import sys
          sys.path.insert(0, "tools")
          from pathlib import Path
          from axml_inspector import inspect_apk
          info = inspect_apk(Path("input/apk/MiuiCamera.apk"))
          print(f"[VERIFY] APK pkg={info.package} versionName={info.version_name!r} versionCode={info.version_code}")
          if info.version_name != "-Universal Cam Evorez":
              print(f"::warning::versionName is {info.version_name!r} (expected Universal Cam Evorez); continuing")
          '
          if [ -f /tmp/patch_report.md ]; then
            cat /tmp/patch_report.md >> "$GITHUB_STEP_SUMMARY"
            APPLIED_LINE="$(grep -m1 '^### Applied APK Patches' /tmp/patch_report.md || true)"
            echo "::notice::${APPLIED_LINE:-patch report missing}"
            SKIPPED_IDS="$(sed -n '/^### Skipped/,$p' /tmp/patch_report.md | grep '^- \*\*' | sed -e 's/^- \*\*//' -e 's/\*\*.*//' | paste -sd ',' - || true)"
            if [ -n "$SKIPPED_IDS" ]; then
              echo "::warning::unmatched patch rules: ${SKIPPED_IDS:0:900}"
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@/tmp/patch_report.md >/dev/null 2>&1 || echo "[PATCH] report comment not posted"
          fi

      - name: Build & validate universal module ZIP
        if: ${{ inputs.inspect_only != true }}
        env:
          OUTPUT_NAME: ${{ inputs.output_name || 'Gold-Stock.zip' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          : > /tmp/build.log
          diag() {
            rc=$?
            [ "$rc" -eq 0 ] && return 0
            CLEAN="$(sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/build.log 2>/dev/null | tail -n 30 | tr '\n' ' ' | cut -c1-900)"
            echo "::error::build step failed (rc=$rc): ${CLEAN}"
            return "$rc"
          }
          trap diag ERR
          ./build.sh --output "dist/${OUTPUT_NAME:-Gold-Stock.zip}" 2>&1 | tee /tmp/build.log
          ls -lh dist/

      - name: Upload flashable module ZIP artifact
        if: ${{ inputs.inspect_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperos-cam-aosp-module
          path: |
            dist/*.zip
            dist/*.zip.sha256

      - name: Publish GitHub Release for direct download
        if: ${{ inputs.inspect_only != true && inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP_FILE="$(ls -1 dist/*.zip | head -n 1)"
          SHA_FILE="${ZIP_FILE}.sha256"
          BASE_NAME="$(basename "$ZIP_FILE")"
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          SHA_SUM="$(awk '{print $1}' "$SHA_FILE")"

          {
            echo "Universal Magisk / KernelSU / KernelSU-Next / APatch flashable module for Android 14–16 AOSP ROMs."
            echo ""
            echo "- **File**: \`${BASE_NAME}\`"
            echo "- **SHA-256**: \`${SHA_SUM}\`"
            echo "- **Install**: Flash directly in Magisk, KernelSU, KernelSU-Next, or APatch and reboot."
            if [ -f /tmp/patch_report.md ]; then
              echo ""
              cat /tmp/patch_report.md
            fi
          } > /tmp/release_notes.md

          gh release create "$TAG" "$ZIP_FILE" "$SHA_FILE" \
            --title "Gold-Stock - HyperOS Camera for AOSP Android 16 (${SHA_SUM:0:12})" \
            --notes-file /tmp/release_notes.md
